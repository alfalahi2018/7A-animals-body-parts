<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Body Parts – Match the pictures with the words</title>
<style>
:root{
  --navy:#1b2a6b; --sky:#bfe3fb; --sky-d:#7fbfe8; --butter:#fdeeb0; --butter-d:#e9c94f; --paper:#fffef9;
  --good:#2e9e6b; --good-bg:#dff5e8; --bad:#d9534f; --bad-bg:#fde8e6; --ink:#16204f;
  --c1:#f7b6c4; --c2:#a9d6f5; --c3:#b8e6b0; --c4:#cbb8f0; --c5:#f7dc7a;
  --head:"Fredoka One","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI","Trebuchet MS",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,#e7f4fd 0%,#f6fbff 50%,#fff7dd 100%);min-height:100vh;touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaters span{position:absolute;font-size:34px;opacity:.14;animation:rise 20s linear infinite}
@keyframes rise{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(35deg)}}
#bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 #0f1a4a}
#bar .logo{font-family:var(--head);font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff;color:var(--navy);border-radius:999px;padding:5px 14px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;min-height:38px}
#bar .snd{background:transparent;border:2px solid #ffffff88;color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px 14px 70px}
.screen{display:none}.screen.on{display:block}
.hero{text-align:center;background:var(--sky);border:3px solid var(--sky-d);border-radius:30px;padding:18px 16px 20px;box-shadow:0 6px 0 var(--sky-d)}
.hero h1{font-family:var(--head);font-weight:400;font-size:clamp(34px,8.5vw,64px);line-height:1;margin:0 0 12px;color:var(--navy)}
.hero .sub{display:inline-block;background:var(--butter);border:3px solid var(--butter-d);border-radius:999px;padding:7px 20px;font-weight:800;font-size:clamp(16px,3.6vw,21px)}
.hero .faces{font-size:34px;margin-top:12px;letter-spacing:8px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.who label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:3px solid var(--sky-d);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:4px solid var(--butter-d);outline-offset:2px}
.how{background:var(--paper);border:3px dashed var(--sky-d);border-radius:20px;padding:12px 18px;margin-bottom:18px;font-weight:700;font-size:17px}
.how b{color:var(--navy)}
.levels{display:grid;gap:14px}
.lv{display:flex;align-items:center;gap:14px;text-align:start;width:100%;background:var(--paper);border:3px solid var(--sky-d);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--sky-d);transition:transform .12s}
.lv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-d)}
.lv .n{flex:0 0 58px;height:58px;border-radius:50%;background:var(--butter);border:3px solid var(--butter-d);font-family:var(--head);font-size:28px;display:grid;place-items:center;color:var(--navy)}
.lv .t{flex:1}.lv .t b{display:block;font-size:21px}.lv .t span{font-size:15px;opacity:.8}
.lv .st{font-weight:800;font-size:16px;text-align:end}
.lv.done{background:var(--good-bg);border-color:var(--good);box-shadow:0 5px 0 var(--good)}
.lv.done .n{background:var(--good);border-color:var(--good);color:#fff}
.big{display:block;margin:22px auto 0;font-family:var(--head);font-size:22px;background:var(--butter);color:var(--navy);border:3px solid var(--butter-d);border-radius:999px;padding:13px 30px;box-shadow:0 5px 0 var(--butter-d);min-height:52px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--butter-d)}
.big[disabled]{background:#e6e6e6;border-color:#b5b5b5;box-shadow:0 5px 0 #b5b5b5;color:#777;cursor:not-allowed}
.ghost{background:#fff;border:3px solid var(--sky-d);color:var(--navy);border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px;min-height:44px}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sbar h2{font-family:var(--head);font-weight:400;font-size:clamp(20px,4.5vw,28px);margin:0;flex:1;color:var(--navy)}
.tip{background:var(--butter);border-radius:16px;padding:9px 14px;font-weight:800;margin-bottom:14px;text-align:center;font-size:clamp(15px,3.4vw,18px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.pic{position:relative;background:#fff;border:4px solid var(--cc,var(--c2));border-radius:22px;padding:0 0 6px;text-align:center;overflow:hidden;transition:transform .12s,box-shadow .12s;width:100%}
.pic img{display:block;width:100%;aspect-ratio:1/.95;object-fit:cover;pointer-events:none}
.pic .no{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:var(--cc,var(--c2));font-family:var(--head);font-size:21px;display:grid;place-items:center;color:var(--navy);border:3px solid #fff}
.pic .slot{display:block;margin:8px 12px 2px;min-height:40px;border-bottom:3px solid var(--navy);font-family:var(--head);font-size:24px;color:var(--navy);line-height:1.5}
.pic.sel{transform:scale(1.04);box-shadow:0 0 0 5px var(--butter-d),0 8px 18px #0003}
.pic.ok{border-color:var(--good)}.pic.ok .slot{color:var(--good);border-color:var(--good)}
.pic.rev{border-color:var(--bad)}.pic.rev .slot{color:var(--bad);border-color:var(--bad)}
.pic.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.bank{margin-top:18px;background:var(--paper);border:3px solid var(--butter-d);border-radius:26px;padding:14px 12px 16px}
.bank h3{font-family:var(--head);font-weight:400;font-size:24px;margin:-30px auto 12px;background:#e3d9ff;border:3px solid #c3b2f2;border-radius:999px;padding:3px 24px;display:table;color:var(--navy)}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.word{font-family:var(--head);font-size:clamp(19px,4.2vw,25px);color:var(--navy);background:var(--wc,#cfe9fb);border:3px solid var(--wb,#8ec6ee);border-radius:18px;padding:10px 20px;min-height:52px;box-shadow:0 4px 0 var(--wb,#8ec6ee);transition:transform .1s}
.word:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wb,#8ec6ee)}
.word.sel{outline:5px solid var(--butter-d);transform:scale(1.07)}
.word.used{opacity:.3;box-shadow:none;cursor:default;text-decoration:line-through}
.word.shake{animation:shake .4s}
.fb{margin-top:16px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.5;text-align:center;display:none}
.fb.show{display:block}.fb.g{background:var(--good-bg);border:3px solid var(--good)}.fb.b{background:var(--bad-bg);border:3px solid var(--bad)}.fb.i{background:#eaf4fd;border:3px solid var(--sky-d)}
.card{background:var(--paper);border:3px solid var(--sky-d);border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--sky-d)}
.res{text-align:center}
.res h2{font-family:var(--head);font-weight:400;font-size:clamp(28px,7vw,44px);margin:0 0 4px;color:var(--navy)}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}.stars .off{filter:grayscale(1);opacity:.25}
.bigscore{font-family:var(--head);font-size:clamp(44px,12vw,76px);color:var(--navy);line-height:1}
.rank{display:inline-block;background:var(--butter);border:3px solid var(--butter-d);border-radius:999px;padding:6px 22px;font-family:var(--head);font-size:22px;margin:10px 0}
.brk{display:grid;gap:8px;max-width:420px;margin:14px auto;text-align:start}
.brk div{display:flex;justify-content:space-between;background:#eaf4fd;border-radius:14px;padding:9px 16px;font-weight:800;font-size:18px}
.msg{font-size:19px;font-weight:700;margin:10px 0}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px}
.ipa{display:block;font-weight:800;font-size:15px;color:#5a6aa8;margin:2px 0 0;letter-spacing:.3px}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:6px}
.lc{position:relative;background:#fff;border:4px solid var(--cc,var(--c2));border-radius:22px;padding:0 0 10px;text-align:center;overflow:hidden;width:100%;transition:transform .12s}
.lc img{display:block;width:100%;aspect-ratio:1/.95;object-fit:cover;pointer-events:none}
.lc .no{position:absolute;top:6px;left:6px;width:40px;height:40px;border-radius:50%;background:var(--cc,var(--c2));font-family:var(--head);font-size:21px;display:grid;place-items:center;color:var(--navy);border:3px solid #fff}
.lc b{display:block;font-family:var(--head);font-weight:400;font-size:26px;color:var(--navy);margin-top:8px}
.lc .spk{display:inline-block;margin-top:6px;background:var(--butter);border:2px solid var(--butter-d);border-radius:999px;padding:3px 14px;font-weight:800;font-size:15px}
.lc.on{transform:scale(1.05);box-shadow:0 0 0 5px var(--butter-d)}
footer{position:relative;z-index:1;text-align:center;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 22px);font-weight:800;color:var(--navy)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:560px){.who{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.floaters span,.pic.shake,.word.shake{animation:none}}
</style>
</head>
<body>
<div class="floaters" aria-hidden="true"></div>
<div id="bar">
  <div class="logo">🐾 Animal Body Parts</div>
  <div class="pill">⭐ <span id="sc">0</span> / <span id="mx">120</span></div>
  <button class="snd" id="vox" aria-label="Pronunciation on/off">🗣️</button>
  <button class="snd" id="snd" aria-label="Sound effects on/off">🔊</button>
</div>

<div class="wrap">
  <section id="home" class="screen on">
    <div class="hero">
      <h1>Animal Body Parts</h1>
      <span class="sub">Match the pictures with the words.</span>
      <div class="faces" aria-hidden="true">🦅 🐱 🦆 🐟 🦔 🦗</div>
    </div>
    <div class="who">
      <div><label for="nm">Name</label><input type="text" id="nm" maxlength="30" autocomplete="off" placeholder="Your name"></div>
      <div><label for="cl">Class</label><input type="text" id="cl" maxlength="12" autocomplete="off" placeholder="e.g. 6/2"></div>
    </div>
    <div class="how">How to play: tap a <b>picture</b>, then tap the correct <b>word</b> in the Word Bank. Tap any word to <b>hear</b> it! 🔊 Choose any level you like!</div>
    <button class="big" id="learnBtn" style="margin:0 auto 18px;background:#e3d9ff;border-color:#c3b2f2;box-shadow:0 5px 0 #c3b2f2">🎧 Listen &amp; Learn the words</button>
    <div class="levels" id="levels"></div>
    <button class="big" id="finish" disabled>Finish all 3 levels to see your result</button>
  </section>
  <section id="level" class="screen"></section>
  <section id="learn" class="screen"></section>
  <section id="results" class="screen"></section>
</div>
<footer>Created by T. Badria Alfalahi</footer>

var cv=$('fx'),cx=cv.getContext('2d'),parts=[],run=false;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(n){var cols=['#1b2a6b','#f2b632','#f7b6c4','#2e9e6b','#7fbfe8','#cbb8f0'];for(var i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:90+Math.random()*50});if(!run){run=true;frame()}}
function frame(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(function(q){return q.life>0});parts.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.a+=.2;q.life--;cx.save();cx.translate(q.x,q.y);cx.rotate(q.a);cx.fillStyle=q.c;cx.fillRect(-q.r/2,-q.r/2,q.r,q.r*.6);cx.restore()});if(parts.length)requestAnimationFrame(frame);else run=false}

/* level */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function openLevel(id){
  S.name=$('nm').value.trim();S.cls=$('cl').value.trim();
  S.cur=LEVELS[id-1];S.sel=null;S.msg=null;
  if(!S.order[id]){var w=S.cur.pics.map(function(n){return ITEMS[n].w}).concat(S.cur.extra);S.order[id]=shuffle(w)}
  renderLevel();
}
function usedWords(L){var u={};L.pics.forEach(function(n){if(S.done[n])u[ITEMS[n].w]=1});return u}
function renderLevel(){
  var L=S.cur,u=usedWords(L),h='';
  h+='<div class="sbar"><button class="ghost" id="back">← Levels</button><h2>'+L.title+' · '+L.sub+'</h2></div>';
  h+='<div class="tip">Tap a picture, then tap its word. Tap a word to hear it! 🔊</div><div class="grid">';
  L.pics.forEach(function(n){
    var d=S.done[n],cls='pic'+(d?(S.rev[n]?' rev':' ok'):'')+(S.sel&&S.sel.k==='p'&&S.sel.v===n?' sel':'')+(S.shake&&S.shake.n===n?' shake':'');
    h+='<button class="'+cls+'" data-n="'+n+'" style="--cc:'+CC[n-1]+'" aria-label="Picture '+n+'"><img alt="" src="'+IMGS[n-1]+'"><span class="no">'+n+'</span><span class="slot">'+(d?esc(ITEMS[n].w)+' 🔊':'')+'</span>'+(d?'<span class="ipa">/'+IPA[ITEMS[n].w]+'/</span>':'')+'</button>';
  });
  h+='</div><div class="bank"><h3>Word Bank</h3><div class="words">';
  S.order[L.id].forEach(function(w,i){
    var cls='word'+(u[w]?' used':'')+(S.sel&&S.sel.k==='w'&&S.sel.v===w?' sel':'')+(S.shake&&S.shake.w===w?' shake':'');
    h+='<button class="'+cls+'" data-w="'+w+'" style="--wc:'+WC[i%6][0]+';--wb:'+WC[i%6][1]+'">'+w+'</button>';
  });
  h+='</div></div>';
  var m=S.msg;h+='<div class="fb'+(m?' show '+m.c:'')+'" id="fb">'+(m?m.t:'')+'</div><div id="nx"></div>';
  $('level').innerHTML=h;show('level');S.shake=null;
  $('back').onclick=homeBack;
  [].forEach.call(document.querySelectorAll('.pic'),function(b){b.onclick=function(){tapPic(+b.dataset.n)}});
  [].forEach.call(document.querySelectorAll('.word'),function(b){b.onclick=function(){tapWord(b.dataset.w)}});
  if(lvDone(L)){
    $('nx').innerHTML='<button class="big" id="nb">Level complete! Back to levels ✓</button>';
    $('nb').onclick=function(){homeBack()};
  }
  upd();
}
function tapPic(n){
  if(S.done[n]){speak(ITEMS[n].w);return}
  if(S.sel&&S.sel.k==='w'){attempt(n,S.sel.v)}
  else{S.sel=(S.sel&&S.sel.k==='p'&&S.sel.v===n)?null:{k:'p',v:n};S.msg={c:'i',t:'Now tap the word that matches picture '+n+'.'};if(!S.sel)S.msg=null;renderLevel()}
}
function tapWord(w){
  if(usedWords(S.cur)[w]){speak(w);return}
  speak(w);
  if(S.sel&&S.sel.k==='p'){attempt(S.sel.v,w)}
  else{S.sel=(S.sel&&S.sel.k==='w'&&S.sel.v===w)?null:{k:'w',v:w};S.msg=S.sel?{c:'i',t:'Now tap the picture for “'+w+'”.'}:null;renderLevel()}
}
function attempt(n,w){
  var it=ITEMS[n];S.sel=null;
  S.tries[n]=S.tries[n]||0;
  if(w===it.w){
    S.done[n]=true;S.pts[n]=S.tries[n]===0?P1:(S.tries[n]===1?P2:0);
    sOk();confetti(S.tries[n]===0?45:20);
    S.msg={c:'g',t:(S.tries[n]===0?'🌟 Correct! +'+P1:'👍 Good! +'+S.pts[n]+' (second try)')+'<br>🔊 <b>'+it.w+'</b> /'+IPA[it.w]+'/<br>'+it.f};
    if(lvDone(S.cur)){setTimeout(function(){sWin();confetti(90)},350)}
  }else{
    S.tries[n]++;sBad();S.shake={n:n,w:w};
    if(S.tries[n]>=2){
      S.done[n]=true;S.rev[n]=true;S.pts[n]=0;
      S.msg={c:'b',t:'💡 The answer is “'+it.w+'” /'+IPA[it.w]+'/. 0 points this time.<br>'+it.f};
    }else{
      S.msg={c:'b',t:'🔎 Not quite. Look carefully at the picture and try again!'};
    }
  }
  renderLevel();
}

/* learn */
function renderLearn(){
  var h='<div class="sbar"><button class="ghost" id="lback">← Back</button><h2>🎧 Listen &amp; Learn</h2></div><div class="tip">Tap a card to hear the word. Say it after me!</div><div class="btns" style="margin:0 0 14px"><button class="big" id="pall" style="margin:0">▶ Play all words</button></div><div class="learn">';
  for(var n=1;n<=12;n++){h+='<button class="lc" data-n="'+n+'" style="--cc:'+CC[n-1]+'"><img alt="" src="'+IMGS[n-1]+'"><span class="no">'+n+'</span><b>'+ITEMS[n].w+'</b><span class="ipa">/'+IPA[ITEMS[n].w]+'/</span><span class="spk">🔊 Listen</span></button>'}
  h+='</div>';
  $('learn').innerHTML=h;show('learn');
  $('lback').onclick=function(){if(window.speechSynthesis)window.speechSynthesis.cancel();homeBack()};
  [].forEach.call(document.querySelectorAll('.lc'),function(b){b.onclick=function(){speak(ITEMS[+b.dataset.n].w);b.classList.add('on');setTimeout(function(){b.classList.remove('on')},700)}});
  $('pall').onclick=function(){
    if(!S.voice||!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    for(var n=1;n<=12;n++){(function(n){speak(ITEMS[n].w,true)})(n)}
  };
}
$('learnBtn').onclick=renderLearn;

/* results */
function results(){
  var t=total(),pct=Math.round(t/MAX*100),stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  var rank=pct>=90?'Animal Expert 🏅':pct>=70?'Nature Explorer 🧭':pct>=40?'Young Zoologist 🐾':'Animal Trainee 📘';
  var nm=S.name||'Explorer';
  var msg=pct>=90?'Amazing, '+esc(nm)+'! You know your animal body parts!':pct>=70?'Well done, '+esc(nm)+'! Great work!':pct>=40?'Good effort, '+esc(nm)+'! Play again to learn them all.':'Keep going, '+esc(nm)+'! Every expert starts by trying again.';
  var sh='';for(var i=0;i<3;i++)sh+='<span class="'+(i<stars?'':'off')+'">⭐</span>';
  var h='<div class="card res"><h2>Mission complete!</h2>'+(S.name?'<div style="font-weight:800;font-size:19px">'+esc(S.name)+(S.cls?' · '+esc(S.cls):'')+'</div>':'')+'<div class="stars">'+sh+'</div><div class="bigscore">'+t+' / '+MAX+'</div><div style="font-weight:800;font-size:20px">'+pct+'%</div><div class="rank">'+rank+'</div><div class="brk">';
  LEVELS.forEach(function(L){h+='<div><span>'+L.title+' · '+L.sub+'</span><span>'+lvPts(L)+' / 40</span></div>'});
  h+='</div><p class="msg">'+msg+'</p><div class="btns"><button class="big" id="again" style="margin:0">🔄 Play again</button><button class="ghost" id="rev">← Back to levels</button></div></div>';
  $('results').innerHTML=h;show('results');sWin();confetti(pct>=70?140:50);
  $('again').onclick=function(){var n=$('nm').value,c=$('cl').value;fresh();$('nm').value=n;$('cl').value=c;homeBack()};
  $('rev').onclick=homeBack;
}
renderHome();
})();
</script>
</body>
</html>
